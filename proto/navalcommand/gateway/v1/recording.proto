syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/observation.proto";
import "navalcommand/gateway/v1/world.proto";
import "navalcommand/gateway/v1/orders.proto";

// Privileged recording types are isolated from operational/public schemas.
message UnitId {
  string value = 1;
}

message TrueKinematicsState {
  optional GeoPoint position = 1;
  optional double speed_mps = 2;
  optional double heading_rad = 3;
  optional double course_over_ground_rad = 4;
}

message TrueResourceAmount {
  ResourceId resource_id = 1;
  ResourceValue amount = 2;
}

message TrueEquipmentInstance {
  EquipmentTypeId type = 1;
  optional bool active = 2;
  optional EquipmentReadiness operational_readiness = 3;
  optional EquipmentDamage damage_state = 4;
  repeated TrueResourceAmount resources = 5;
}

message TrueAircraftInventoryEntry {
  UnitTypeId type = 1;
  string squadron = 2;
  uint32 unreserved_count = 3;
  repeated LoadoutId loadouts = 4;
}

message TrueAirOperationsState {
  repeated TrueAircraftInventoryEntry inventory = 1;
  optional uint32 pending_operations = 2;
  optional uint32 onboard_count = 3;
  optional uint32 reserved_count = 4;
  optional uint32 cooldown_count = 5;
  optional double measured_at_seconds = 6;
}

message TrueEquipmentCollection {
  repeated TrueEquipmentInstance items = 1;
}

message TrueUnitInstance {
  UnitId identity = 1;
  optional UnitTypeId type = 2;
  optional TrueKinematicsState kinematics = 3;
  TrueEquipmentCollection equipment = 4;
  optional bool airborne = 5;
  TrueAirOperationsState air_operations = 6;
}

message AuthoritativeMembership {
  UnitId unit_id = 1;
  FactionId faction = 2;
  TaskForceId task_force = 3;
}

message SimulationSnapshot {
  string session_id = 1;
  double captured_at_seconds = 2;
  repeated TrueUnitInstance units = 3;
  repeated AuthoritativeMembership memberships = 4;
}

message PrivilegedObservationAssociation {
  ObserverId observer = 1;
  ObservationId observation = 2;
  UnitId truth = 3;
}

// Internal privileged recording only; never returned by provider or RPC endpoints.
message RecordedSession {
  SimulationSnapshot simulation = 1;
  repeated ObserverSnapshot perspectives = 2;
  repeated PrivilegedObservationAssociation associations = 3;
  repeated OrderRequest decisions = 4;
  repeated OrderResult outcomes = 5;
}
