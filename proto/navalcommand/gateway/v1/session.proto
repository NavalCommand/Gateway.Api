syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/observation.proto";
message Query {
  string session_id = 1;
  Subject subject = 2;
  string request_id = 3;
}
message Session {
  uint32 schema_version = 1;
  string session_id = 2;
  string observer_id = 3;
  bool ready = 4;
}
