syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/observation.proto";
import "navalcommand/gateway/v1/world.proto";

enum Availability {
  UNKNOWN = 0;
  EXECUTABLE = 1;
  BLOCKED = 2;
  UNSUPPORTED = 3;
}

enum OrderKind {
  ORDER_KIND_REPLACE_ROUTE = 0;
  ORDER_KIND_APPEND_ROUTE = 1;
  ORDER_KIND_IDLE_WAYPOINT = 2;
  ORDER_KIND_LAUNCH_AIRCRAFT = 3;
}

enum Stage {
  STAGE_UNKNOWN = 0;
  REQUEST_RECEIVED = 1;
  REJECTED = 2;
  NATIVE_TASK_CREATED = 3;
  MOVEMENT_OBSERVED = 4;
  ROUTE_MUTATED = 5;
  EXECUTION_UNKNOWN = 6;
  PREPARING = 7;
  AIRCRAFT_SPAWNED = 8;
  AIRBORNE = 9;
}

enum RouteMode {
  IDLE_WAYPOINT = 0;
  REPLACE_ROUTE = 1;
  APPEND_WAYPOINT = 2;
}

message OrderEligibility {
  OrderKind kind = 1;
  Availability availability = 2;
  string reason = 3;
  LaunchAircraft launch_option = 4;
}

message OrderEligibilityState {
  // A missing row is not executable; absence is interpreted as unknown/unreported.
  repeated OrderEligibility items = 1;
}

message Waypoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  RouteMode route_mode = 3;
}

message LaunchAircraft {
  AircraftSelection selection = 1;
  uint32 count = 2;
}

message OrderRequest {
  string session_id = 1;
  string request_id = 2;
  ObserverId observer = 3;
  ObservationId observation = 4;
  uint64 based_on_version = 5;
  // Exactly one payload is required; provider checks authority/current state.
  oneof payload {
    Waypoint waypoint = 6;
    LaunchAircraft launch_aircraft = 7;
  }
}

message OrderResult {
  string session_id = 1;
  string request_id = 2;
  Stage stage = 3;
  string reason = 4;
  double sampled_at_seconds = 5;
  optional double displacement_m = 6;
  repeated RoutePoint route_before = 7;
  repeated RoutePoint route_after = 8;
  RouteMode route_mode = 9;
  ObserverId observer = 10;
  ObservationId spawned_observation_id = 11;
}

message OrderDiscovery {
  string session_id = 1;
  ObserverId observer = 2;
  ObservationId observation = 3;
  OrderEligibilityState eligibility = 4;
  uint64 based_on_version = 5;
}
