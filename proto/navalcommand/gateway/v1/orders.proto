syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/observation.proto";

enum Availability {
  UNKNOWN = 0;
  EXECUTABLE = 1;
  BLOCKED = 2;
  UNSUPPORTED = 3;
}
enum OrderKind {
  ORDER_KIND_REPLACE_ROUTE = 0;
  ORDER_KIND_APPEND_ROUTE = 1;
  ORDER_KIND_IDLE_WAYPOINT = 2;
  ORDER_KIND_LAUNCH_AIRCRAFT = 3;
}
enum Stage {
  STAGE_UNKNOWN = 0;
  REQUEST_RECEIVED = 1;
  REJECTED = 2;
  NATIVE_TASK_CREATED = 3;
  MOVEMENT_OBSERVED = 4;
  ROUTE_MUTATED = 5;
  EXECUTION_UNKNOWN = 6;
  PREPARING = 7;
  AIRCRAFT_SPAWNED = 8;
  AIRBORNE = 9;
}
// Idle-waypoint mode appends only when native task selection is idle; never replaces a route.
enum RouteMode {
  IDLE_WAYPOINT = 0;
  REPLACE_ROUTE = 1;
  APPEND_WAYPOINT = 2;
}
message OrderEligibility {
  OrderKind kind = 1;
  Availability availability = 2;
  string reason = 3;
  AircraftLaunch launch_option = 4;
}
message Waypoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  RouteMode route_mode = 3;
}
message AircraftLaunch {
  UnitTypeId unit_type_id = 1;
  string squadron = 2;
  LoadoutId loadout_id = 3;
  uint32 count = 4;
}
message OrderRequest {
  string session_id = 1;
  string request_id = 2;
  UnitId unit_id = 3;
  uint64 based_on_version = 4;
  // Exactly one payload is required. Authority is revalidated by the provider.
  oneof payload {
    Waypoint waypoint = 5;
    AircraftLaunch aircraft_launch = 6;
  }
}
message OrderResult {
  string session_id = 1;
  string request_id = 2;
  Stage stage = 3;
  string reason = 4;
  double sampled_at_seconds = 5;
  optional double displacement_m = 6;
  repeated RoutePoint route_before = 7;
  repeated RoutePoint route_after = 8;
  RouteMode route_mode = 9;
  UnitId spawned_unit_id = 10;
}
message OrderEligibilityState {
  CollectionCoverage coverage = 1;
  repeated OrderEligibility items = 2;
}
message OrderDiscovery {
  string session_id = 1;
  UnitId unit_id = 2;
  OrderEligibilityState eligibility = 3;
  uint64 based_on_version = 4;
}
