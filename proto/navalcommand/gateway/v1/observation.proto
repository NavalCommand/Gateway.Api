syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";

// Unknown has no members. Partial empty is incomplete enumeration, not known empty.
enum CollectionCoverage {
  COVERAGE_UNKNOWN = 0;
  COVERAGE_PARTIAL = 1;
  COVERAGE_COMPLETE = 2;
}
// Session/observer observation identity; never proof of command authority.
message UnitId { string value = 1; }
message UnitTypeId { string value = 1; }
message EquipmentTypeId { string value = 1; }
message LoadoutId { string value = 1; }
message ResourceId { string value = 1; }
message RoutePoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  string label = 3;
}
