syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";


// Opaque identities are distinct: ObserverId scopes contact handles; neither implies authority.
message ObserverId {
  string value = 1;
}

message ObservationId {
  string value = 1;
}

message UnitTypeId {
  string value = 1;
}

message EquipmentTypeId {
  string value = 1;
}
// Only source-backed contributors are listed; an empty list is not proof there were none.
message ObservationContributor {
  ObservationId observer = 1;
  repeated EquipmentTypeId sensors = 2;
}


message LoadoutId {
  string value = 1;
}

message ResourceId {
  string value = 1;
}

message RoutePoint {
  double latitude_deg = 1;
  double longitude_deg = 2;
  string label = 3;
  optional double altitude_m = 4;
}
