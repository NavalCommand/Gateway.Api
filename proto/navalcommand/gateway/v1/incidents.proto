syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/observation.proto";
// Reserved minimal representation; no public incident reader in this slice.
message Incident {
  uint64 sequence = 1;
  string session_id = 2;
  double operational_seconds = 3;
  UnitId unit_id = 4;
  string kind = 5;
}
