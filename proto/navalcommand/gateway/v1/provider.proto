syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/world.proto";
import "navalcommand/gateway/v1/orders.proto";

// Public provider envelope: observer-visible snapshot plus separate order overlay.
// Privileged simulation and correlation messages are deliberately not reachable here.
message ProviderObservation {
  ObserverSnapshot snapshot = 1;
  repeated OrderDiscovery order_availability = 2;
}
