syntax = "proto3";
package navalcommand.gateway.v1;
option csharp_namespace = "NavalCommand.Gateway.Wire";
import "navalcommand/gateway/v1/observation.proto";

message GeoPoint {
  optional double latitude_deg = 1;
  optional double longitude_deg = 2;
  optional double altitude_m = 3;
}

// Position components describe an observed center and optional source-backed error geometry;
// their presence does not claim a complete ground-truth position.
message ObservedErrorEllipse {
  double major_axis_m = 1;
  double minor_axis_m = 2;
  double orientation_rad = 3;
}

message ObservedPosition {
  optional double latitude_deg = 1;
  optional double longitude_deg = 2;
  ObservedErrorEllipse error_ellipse = 3;
}


message Route {
  repeated RoutePoint points = 1;
}

enum EquipmentReadiness {
  EQUIPMENT_READY = 0;
  EQUIPMENT_BUSY = 1;
  EQUIPMENT_UNAVAILABLE = 2;
}

enum EquipmentDamage {
  EQUIPMENT_INTACT = 0;
  EQUIPMENT_DAMAGED = 1;
  EQUIPMENT_DESTROYED = 2;
}

message FactionId {
  string value = 1;
}

message TaskForceId {
  string value = 1;
}

message ResourceValue {
  oneof quantity {
    uint64 discrete = 1;
    double continuous = 2;
  }
}

message ResourceObservation {
  ResourceId resource_id = 1;
  optional ResourceValue amount = 2;
}


message EquipmentObservation {
  optional EquipmentTypeId type_id = 1;
  optional bool active = 2;
  // Only currently reported resources; an empty list does not assert exhaustiveness.
  repeated ResourceObservation resources = 3;
}

message KinematicsObservation {
  oneof position_state {
    GeoPoint exact_position = 1;
    ObservedPosition partial_position = 2;
  }
  optional double speed_mps = 3;
  optional double heading_rad = 4;
  optional double course_over_ground_rad = 5;
}

message NavigationObservation {
  optional Route planned_route = 1;
}

message AircraftObservation {
  optional bool airborne = 1;
}

message AircraftSelection {
  UnitTypeId type = 1;
  string squadron = 2;
  LoadoutId loadout = 3;
}

message AircraftInventoryEntry {
  optional UnitTypeId type = 1;
  optional string squadron = 2;
  optional uint32 unreserved_count = 3;
  // Reported loadout choices, not a completeness claim.
  repeated LoadoutId loadouts = 4;
}

message AirOperationsObservation {
  // Currently reported type/squadron inventory groups only; absent groups are unknown/unreported.
  repeated AircraftInventoryEntry inventory = 1;
  optional uint32 pending_operations = 2;
  optional uint32 onboard_count = 3;
  optional uint32 reserved_count = 4;
  optional uint32 cooldown_count = 5;
  optional double measured_at_seconds = 6;
}

message UnitObservation {
  ObservationId identity = 1;
  optional UnitTypeId type = 2;
  KinematicsObservation kinematics = 3;
  // Only currently reported equipment items; an empty list does not mean known empty.
  repeated EquipmentObservation equipment = 4;
  NavigationObservation navigation = 5;
  AircraftObservation aircraft = 6;
  AirOperationsObservation air_operations = 7;
  optional double measured_at_seconds = 8;
  optional string name = 9;
  // Only contributors explicitly reported for this observation.
  repeated ObservationContributor contributors = 10;
}

message ObserverUnitRelationship {
  ObservationId observation = 1;
  optional FactionId faction = 2;
  optional TaskForceId task_force = 3;
}

message ObserverSnapshot {
  string session_id = 1;
  ObserverId observer = 2;
  bool ready = 3;
  bool truncated = 4;
  uint64 version = 5;
  double captured_at_seconds = 6;
  repeated UnitObservation units = 7;
  // Only reported observer relationships; missing rows are not proof of no relationship.
  repeated ObserverUnitRelationship memberships = 8;
  uint32 schema_version = 9; // Current canonical observer schema version is 4.
}



